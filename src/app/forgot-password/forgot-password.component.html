<ion-header class="header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/auth" color="dark"></ion-back-button>
    </ion-buttons>
    <ion-title>Reset Password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="content">
  <div class="inner">
    <div class="logo-circle small">
      <img src="assets/whisper-logo.jpg" class="logo" alt="Whisper Logo" />
    </div>

    <form class="form" (ngSubmit)="sendReset()">
      <ion-item fill="outline" class="input-item">
        <ion-label position="floating">Email</ion-label>
        <ion-input
          [(ngModel)]="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          required
        ></ion-input>
      </ion-item>

      <ion-button
        expand="block"
        class="primary-btn"
        type="submit"
        [disabled]="!email"
      >
        Send Reset Link
      </ion-button>
    </form>

    <!-- changed from routerLink to click -->
    <ion-button fill="clear" class="back-btn" (click)="goLogin()">
      ← Back to Log In
    </ion-button>
  </div>
</ion-content>
