<ion-content>
  <div class="card-sheet">
    <div class="logo-circle">
      <img src="assets/whisper-logo.jpg" class="logo" alt="Whisper Logo" />
    </div>

    <div class="form-card">
      <form (ngSubmit)="login()">
        <ion-item>
          <ion-input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="Email"
            required
          ></ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Password"
            required
          ></ion-input>
        </ion-item>

        <ion-button expand="block" class="sign-in-btn" type="submit">
          SIGN IN
        </ion-button>
      </form>

      <ion-button
        *ngIf="showForgot"
        fill="clear"
        color="dark"
        class="forgot-link"
        (click)="goForgot()"
      >
        Forgot Password?
      </ion-button>

      <ion-button
        fill="clear"
        class="signup-link"
        (click)="navigateToSignup()"
      >
        Don't have an account? <span>Sign up</span>
      </ion-button>
    </div>
  </div>
</ion-content>
