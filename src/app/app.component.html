<!-- src/app/app.component.html -->
<ion-app>
  <!-- HEADER (only on protected routes) -->
  <ion-header *ngIf="showMenu && isProtectedRoute">
    <ion-toolbar class="app-header">
      <ion-buttons slot="end">
        <ion-menu-button autoHide="false"></ion-menu-button>
      </ion-buttons>

      <div class="header-content">
        <div class="greeting">
          <h1>Hello, {{ firstName }}</h1>
        </div>
        <div class="location">
          <ion-icon name="location-outline"></ion-icon>
          <span>{{ locationDisplay }}</span>
        </div>
      </div>
    </ion-toolbar>
  </ion-header>

  <!-- SIDE MENU -->
  <ion-menu contentId="mainContent" type="overlay" *ngIf="showMenu && isProtectedRoute">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list lines="full">
        <ion-item button (click)="goToProfile()" detail>
          <ion-icon slot="start" name="person-outline" color="primary"></ion-icon>
          <ion-label>Profile</ion-label>
        </ion-item>

        <ion-item button (click)="logout()" detail>
          <ion-icon slot="start" name="log-out-outline" color="primary"></ion-icon>
          <ion-label>Logout</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <!-- MAIN CONTENT -->
  <ion-router-outlet id="mainContent"></ion-router-outlet>

  <!-- BOTTOM NAV -->
  <app-menu *ngIf="showMenu && isProtectedRoute"></app-menu>
</ion-app>
