<ion-header>
  <ion-toolbar color="light">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen class="home-page">
  <!-- HERO -->
  <section class="hero">
    <img src="assets/whisper-logo.svg" class="hero-logo" alt="Whisper logo" />
    <h1 class="hero-title">Welcome to Whisper</h1>
    <p class="hero-tagline">Your discreet safety companion.</p>
  </section>

  <!-- CAROUSEL -->
  <ion-slides class="info-carousel" [options]="slideOpts">
    <ion-slide *ngFor="let slide of slides"
               [ngClass]="{
                  'bg-stat': slide.title==='Did you know?',
                  'bg-walk': slide.title==='Amanda’s story',
                  'bg-rain': slide.title==='Instant Alerts'
                }">
      <div class="info-overlay">
        <img [src]="slide.src" class="icon" [alt]="slide.alt" />
        <h2>{{ slide.title }}</h2>
        <p [innerHTML]="slide.html"></p>
      </div>
    </ion-slide>
  </ion-slides>

  <!-- CTA -->
  <ion-card class="cta-card">
    <ion-card-header><ion-card-title>Explore Nearby Incidents</ion-card-title></ion-card-header>
    <ion-card-content>
      Stay informed about crime reports around you and plan safer routes.
      <ion-button routerLink="/map" expand="block">Open Map</ion-button>
    </ion-card-content>
  </ion-card>

  <!-- ensure bottom nav never covers content -->
  <div class="bottom-spacer"></div>
</ion-content>

<app-contacts-sheet></app-contacts-sheet>
